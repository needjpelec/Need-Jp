<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NeedJp Electronics - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --neon-cyan: #00e5ff;
            --neon-violet: #7b2ff7;
            --neon-gradient: linear-gradient(135deg, var(--neon-cyan), var(--neon-violet));
            --bg-deep: #070b14;
            --bg-panel: #0e1420;
            --bg-card: #121a2b;
            --border-soft: rgba(0, 229, 255, 0.18);
            --accent-red: #ff2d55;
            --text-main: #e8edf6;
            --text-dim: #8b98b0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', -apple-system, sans-serif; }
        body { background: var(--bg-deep); color: var(--text-main); padding: 70px 12px 30px; }
        header { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #05070d; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 1000; border-bottom: 1px solid var(--border-soft); }
        header h1 { font-family: 'Orbitron', sans-serif; font-size: 14px; color: var(--neon-cyan); letter-spacing: 0.5px; }
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 30%, #101830 0%, #05070d 70%); display: flex; justify-content: center; align-items: center; z-index: 99999; padding: 20px; }
        .login-card { background: var(--bg-panel); padding: 28px; border-radius: 20px; width: 100%; max-width: 360px; text-align: center; border: 1px solid var(--border-soft); box-shadow: 0 0 40px rgba(0,229,255,0.1); }
        .login-card h2 { font-family: 'Orbitron', sans-serif; font-size: 16px; color: var(--text-main); }
        .admin-container { max-width: 640px; margin: 0 auto; display: none; }
        .card { background: var(--bg-panel); padding: 18px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); margin-bottom: 20px; border: 1px solid var(--border-soft); }
        .card h2 { font-family: 'Orbitron', sans-serif; font-size: 14px; color: var(--neon-cyan); margin-bottom: 14px; letter-spacing: 0.5px; text-transform: uppercase; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; color: var(--text-dim); }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1.5px solid var(--border-soft); border-radius: 10px; font-size: 15px; outline: none; background: var(--bg-card); color: var(--text-main); }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--neon-cyan); box-shadow: 0 0 0 3px rgba(0,229,255,0.12); }
        .btn-submit { background: var(--neon-gradient); color: #05070d; border: none; padding: 14px; font-weight: 800; border-radius: 12px; cursor: pointer; width: 100%; text-transform: uppercase; letter-spacing: 0.5px; }
        .preview-box { margin-top: 10px; display: none; text-align: center; }
        .preview-box img { max-width: 120px; border-radius: 10px; border: 1px solid var(--border-soft); }
        .preview-thumb { position: relative; width: 70px; height: 70px; }
        .preview-thumb img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-soft); }
        .preview-thumb .remove-thumb { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-red); color: #fff; border: none; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .preview-thumb .cover-badge { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); background: var(--neon-gradient); color: #05070d; font-size: 8px; font-weight: 800; padding: 1px 6px; border-radius: 6px; white-space: nowrap; }

        .search-box { position: relative; margin-bottom: 15px; }
        .search-box input { width: 100%; padding: 10px 12px 10px 38px; border: 1.5px solid var(--border-soft); border-radius: 10px; font-size: 14px; outline: none; background: var(--bg-card); color: var(--text-main); }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 14px; }

        .product-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-soft); gap: 8px; }
        .product-info { display: flex; align-items: center; gap: 10px; flex: 1; }
        .product-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-soft); }
        .product-details strong { display: block; font-size: 13px; color: var(--text-main); }
        .product-details span { color: var(--neon-cyan); font-size: 12px; font-weight: bold; }

        .actions { display: flex; gap: 6px; align-items: center; }
        .btn-stock { border: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .btn-in-stock { background: rgba(46,230,166,0.15); color: #2ee6a6; }
        .btn-out-stock { background: rgba(255,140,0,0.15); color: #ff9d3d; }
        .btn-delete { background: rgba(255,45,85,0.15); color: var(--accent-red); border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }

        /* Orders */
        .order-item { border: 1px solid var(--border-soft); border-radius: 12px; padding: 14px; margin-bottom: 12px; background: var(--bg-card); }
        .order-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
        .order-product { font-weight: 700; font-size: 14px; color: var(--text-main); }
        .order-total { font-family: 'Orbitron', sans-serif; font-weight: 800; color: var(--neon-cyan); font-size: 14px; white-space: nowrap; }
        .order-details { font-size: 12.5px; color: var(--text-dim); line-height: 1.7; margin-bottom: 10px; }
        .order-details b { color: var(--text-main); }
        .order-status-badge { display: inline-block; font-size: 10px; font-weight: 800; padding: 3px 10px; border-radius: 12px; background: rgba(255,193,7,0.15); color: #ffc94d; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .order-edit { border-top: 1px dashed var(--border-soft); padding-top: 10px; margin-top: 6px; }
        .order-edit .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .order-edit input, .order-edit select { width: 100%; padding: 9px 10px; border: 1.5px solid var(--border-soft); border-radius: 8px; font-size: 13px; background: var(--bg-panel); color: var(--text-main); outline: none; }
        .order-edit input:focus, .order-edit select:focus { border-color: var(--neon-cyan); }
        .order-edit label { font-size: 10.5px; color: var(--text-dim); display: block; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.3px; }
        .order-actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn-call { flex: 1; background: var(--bg-panel); color: var(--neon-cyan); border: 1px solid var(--border-soft); padding: 9px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-update { flex: 1; background: var(--neon-gradient); color: #05070d; border: none; padding: 9px; border-radius: 8px; font-size: 12px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-order-delete { flex: 1; background: rgba(255,45,85,0.12); color: var(--accent-red); border: 1px solid rgba(255,45,85,0.35); padding: 9px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }

        .tab-switch { display: flex; gap: 8px; margin-bottom: 18px; }
        .tab-btn { flex: 1; padding: 10px; border-radius: 10px; background: var(--bg-panel); border: 1px solid var(--border-soft); color: var(--text-dim); font-weight: 700; font-size: 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; position: relative; }
        .tab-btn.active { background: var(--neon-gradient); color: #05070d; border-color: transparent; }

        @keyframes flashGlow { 0%, 100% { box-shadow: 0 0 0 rgba(255,45,85,0); } 50% { box-shadow: 0 0 18px rgba(255,45,85,0.85); } }
        .tab-btn.flash { animation: flashGlow 0.7s ease-in-out 4; }

        .notice-banner { background: rgba(0,229,255,0.08); border: 1px solid var(--border-soft); color: var(--text-dim); padding: 10px 14px; border-radius: 10px; font-size: 11.5px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .notice-banner b { color: var(--neon-cyan); }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-card">
            <h2 style="margin-bottom:15px;"><i class="fa-solid fa-lock" style="color: var(--neon-cyan);"></i> NeedJp Electronics Admin</h2>
            <form id="adminLoginForm">
                <div class="form-group"><input type="text" id="adminUser" placeholder="ইউজারনেম" required></div>
                <div class="form-group"><input type="password" id="adminPass" placeholder="পাসওয়ার্ড" required></div>
                <button type="submit" class="btn-submit">লগইন করুন</button>
            </form>
        </div>
    </div>

    <div class="admin-container" id="adminContainer">
        <header>
            <h1><i class="fa-solid fa-microchip"></i> NEEDJP ELECTRONICS ADMIN</h1>
            <button style="background:none; border:none; color:#fff; font-size:16px; cursor:pointer;" onclick="logoutAdmin()"><i class="fa-solid fa-right-from-bracket"></i></button>
        </header>

        <div class="notice-banner">
            <i class="fa-solid fa-circle-info"></i>
            <span>নতুন অর্ডার এলে এই পেজ খোলা থাকা অবস্থায় সাউন্ড ও নোটিফিকেশন পাবেন। ব্রাউজার নোটিফিকেশন চালু করতে উপরে অনুমতি দিন (<b>Allow</b>)।</span>
        </div>

        <div class="tab-switch">
            <button class="tab-btn active" id="tabProductsBtn" onclick="switchTab('products')"><i class="fa-solid fa-box"></i> প্রোডাক্ট</button>
            <button class="tab-btn" id="tabOrdersBtn" onclick="switchTab('orders')"><i class="fa-solid fa-receipt"></i> অর্ডার <span id="orderCountBadge" style="background:var(--accent-red); color:#fff; border-radius:10px; padding:1px 7px; font-size:10px; margin-left:4px;"></span></button>
        </div>

        <div id="productsTab">
            <div class="card">
                <h2>নতুন প্রোডাক্ট যোগ করুন</h2>
                <form id="addProductForm">
                    <div class="form-group"><label>প্রোডাক্টের নাম *</label><input type="text" id="pTitle" required></div>
                    <div class="form-group"><label>মূল্য (BDT) *</label><input type="number" id="pPrice" required></div>
                    <div class="form-group">
                        <label>ছবি নির্বাচন করুন (একাধিক ছবি একসাথে সিলেক্ট করতে পারবেন) *</label>
                        <input type="file" id="pImgFile" accept="image/*" multiple onchange="handleImageCompress(event)">
                    </div>
                    <div class="form-group">
                        <label>অথবা ছবির URL দিন</label>
                        <div style="display:flex; gap:8px;">
                            <input type="url" id="pImgUrl" placeholder="https://..." style="flex:1;">
                            <button type="button" onclick="addImageByUrl()" style="background:var(--bg-card); color:var(--neon-cyan); border:1px solid var(--border-soft); border-radius:10px; padding:0 16px; font-weight:700; cursor:pointer; white-space:nowrap;">+ যোগ করুন</button>
                        </div>
                    </div>
                    <div class="preview-box" id="previewBox" style="display:none;">
                        <div id="imgPreviewStrip" style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;"></div>
                        <p style="font-size:10.5px; color:var(--text-dim); margin-top:6px;"><i class="fa-solid fa-circle-info"></i> প্রথম ছবিটি প্রধান (কভার) ছবি হিসেবে দেখানো হবে</p>
                    </div>
                    <div class="form-group"><label>বিবরণ</label><textarea id="pDesc" rows="3"></textarea></div>
                    <button type="submit" class="btn-submit" id="saveBtn"><i class="fa-solid fa-cloud-arrow-up"></i> আপলোড করুন</button>
                </form>
            </div>

            <div class="card">
                <h2>প্রোডাক্ট তালিকা ও স্টক ম্যানেজমেন্ট</h2>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="adminSearchInput" placeholder="প্রোডাক্ট খুঁজুন..." oninput="filterAdminProducts()">
                </div>
                <div id="adminProductList"></div>
            </div>
        </div>

        <div id="ordersTab" style="display:none;">
            <div class="card">
                <h2>সকল অর্ডার</h2>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="orderSearchInput" placeholder="নাম, ফোন বা প্রোডাক্ট দিয়ে খুঁজুন..." oninput="filterOrders()">
                </div>
                <div id="ordersList"></div>
            </div>
        </div>
    </div>

    <datalist id="deliveryServices">
        <option value="Pathao">
        <option value="Steadfast">
        <option value="RedX">
        <option value="eCourier">
        <option value="নিজস্ব রাইডার">
    </datalist>

    <script>
        const ADMIN_USER = "Needjpelec", ADMIN_PASS = "Elec@2025";
        let selectedImages = [];
        let allProductsCache = [];
        let allOrdersCache = [];
        let isFirstOrdersSnapshot = true;

        const ORDER_STATUS_OPTIONS = [
            { value: 'Pending', label: 'Pending - অর্ডার প্লেসড' },
            { value: 'Confirmed', label: 'Confirmed - কনফার্মড' },
            { value: 'Picked Up', label: 'Picked Up - পিকড আপ' },
            { value: 'Out for Delivery', label: 'Out for Delivery - ডেলিভারিতে যাচ্ছে' },
            { value: 'Delivered', label: 'Delivered - ডেলিভারড' },
            { value: 'Cancelled', label: 'Cancelled - বাতিল' }
        ];

        const firebaseConfig = {
          apiKey: "AIzaSyDjXLiTltnnwuiuT3mKharRvliG_X7ia7w",
          authDomain: "need-jp-electronics-store.firebaseapp.com",
          projectId: "need-jp-electronics-store",
          storageBucket: "need-jp-electronics-store.firebasestorage.app",
          messagingSenderId: "944877931966",
          appId: "1:944877931966:web:55954dee5aa6041df2bdef"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('needjp_admin_logged') === 'true') showAdminDashboard();
        });

        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (document.getElementById('adminUser').value.trim() === ADMIN_USER && document.getElementById('adminPass').value.trim() === ADMIN_PASS) {
                sessionStorage.setItem('needjp_admin_logged', 'true');
                showAdminDashboard();
            } else alert('ভুল পাসওয়ার্ড!');
        });

        function showAdminDashboard() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminContainer').style.display = 'block';

            if (window.Notification && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
                Notification.requestPermission();
            }

            loadAdminProducts();
            loadOrders();
        }

        function logoutAdmin() { sessionStorage.removeItem('needjp_admin_logged'); location.reload(); }

        function switchTab(tab) {
            document.getElementById('productsTab').style.display = tab === 'products' ? 'block' : 'none';
            document.getElementById('ordersTab').style.display = tab === 'orders' ? 'block' : 'none';
            document.getElementById('tabProductsBtn').classList.toggle('active', tab === 'products');
            document.getElementById('tabOrdersBtn').classList.toggle('active', tab === 'orders');
        }

        /* ---------- NEW ORDER NOTIFICATION (sound + browser notification) ---------- */
        function playNotificationSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.type = 'sine';
                o.frequency.setValueAtTime(880, ctx.currentTime);
                o.frequency.setValueAtTime(1180, ctx.currentTime + 0.15);
                g.gain.setValueAtTime(0.18, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                o.connect(g); g.connect(ctx.destination);
                o.start(); o.stop(ctx.currentTime + 0.5);
            } catch (e) { console.log('sound error', e); }
        }

        function notifyNewOrder(data) {
            playNotificationSound();
            if (window.Notification && Notification.permission === 'granted') {
                new Notification('🛍️ নতুন অর্ডার এসেছে!', {
                    body: `${data.product || 'প্রোডাক্ট'} — ৳${data.total || 0} — ${data.customerName || ''}`
                });
            }
            const btn = document.getElementById('tabOrdersBtn');
            btn.classList.add('flash');
            setTimeout(() => btn.classList.remove('flash'), 3000);
        }

        /* ---------- PRODUCTS (multi-image) ---------- */
        function renderImagePreviewStrip() {
            const strip = document.getElementById('imgPreviewStrip');
            const box = document.getElementById('previewBox');
            strip.innerHTML = '';
            if (selectedImages.length === 0) {
                box.style.display = 'none';
                return;
            }
            box.style.display = 'block';
            selectedImages.forEach((src, idx) => {
                const thumb = document.createElement('div');
                thumb.className = 'preview-thumb';
                thumb.innerHTML = `
                    <img src="${src}">
                    <button type="button" class="remove-thumb" onclick="removeSelectedImage(${idx})"><i class="fa-solid fa-xmark"></i></button>
                    ${idx === 0 ? '<span class="cover-badge">COVER</span>' : ''}
                `;
                strip.appendChild(thumb);
            });
        }

        function removeSelectedImage(idx) {
            selectedImages.splice(idx, 1);
            renderImagePreviewStrip();
        }

        function compressFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const maxWidth = 700;
                        let width = img.width, height = img.height;
                        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.65));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function handleImageCompress(event) {
            const files = Array.from(event.target.files || []);
            if (files.length === 0) return;
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ছবি প্রসেস হচ্ছে...';
            try {
                for (const file of files) {
                    const compressed = await compressFile(file);
                    selectedImages.push(compressed);
                }
                renderImagePreviewStrip();
            } catch (err) {
                console.error(err);
                alert('ছবি প্রসেস করতে সমস্যা হয়েছে, আবার চেষ্টা করুন।');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> আপলোড করুন';
                event.target.value = '';
            }
        }

        function addImageByUrl() {
            const urlInput = document.getElementById('pImgUrl');
            const url = urlInput.value.trim();
            if (!url) return alert('একটি ছবির URL দিন!');
            selectedImages.push(url);
            urlInput.value = '';
            renderImagePreviewStrip();
        }

        document.getElementById('addProductForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (selectedImages.length === 0) return alert('অন্তত একটি ছবি যোগ করুন!');

            db.collection('products').add({
                title: document.getElementById('pTitle').value.trim(),
                price: Number(document.getElementById('pPrice').value),
                images: selectedImages,
                image: selectedImages[0],
                description: document.getElementById('pDesc').value.trim(),
                inStock: true,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert('প্রোডাক্ট আপলোড হয়েছে!');
                document.getElementById('addProductForm').reset();
                selectedImages = [];
                renderImagePreviewStrip();
            }).catch(err => {
                console.error(err);
                alert('আপলোড করতে সমস্যা হয়েছে, আবার চেষ্টা করুন।');
            });
        });

        function loadAdminProducts() {
            db.collection('products').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                allProductsCache = [];
                snapshot.forEach(doc => {
                    allProductsCache.push({ id: doc.id, ...doc.data() });
                });
                renderAdminProducts(allProductsCache);
            });
        }

        function renderAdminProducts(products) {
            const list = document.getElementById('adminProductList');
            list.innerHTML = '';

            if (products.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:var(--text-dim); padding:15px; font-size:13px;">কোনো প্রোডাক্ট পাওয়া যায়নি!</p>';
                return;
            }

            products.forEach(p => {
                const id = p.id;
                const isStock = p.inStock !== false;
                const thumb = (Array.isArray(p.images) && p.images.length > 0) ? p.images[0] : (p.image || '');
                const imgCount = Array.isArray(p.images) ? p.images.length : (p.image ? 1 : 0);

                const div = document.createElement('div');
                div.className = 'product-item';
                div.innerHTML = `
                    <div class="product-info">
                        <img src="${thumb}" class="product-img">
                        <div class="product-details">
                            <strong>${p.title} ${imgCount > 1 ? `<span style="color:var(--text-dim); font-weight:600; font-size:10px;">(${imgCount} ছবি)</span>` : ''}</strong>
                            <span>৳${p.price}</span>
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn-stock ${isStock ? 'btn-in-stock' : 'btn-out-stock'}" onclick="toggleStock('${id}', ${isStock})">
                            ${isStock ? 'In Stock' : 'Stock Out'}
                        </button>
                        <button class="btn-delete" onclick="deleteProduct('${id}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function filterAdminProducts() {
            const query = document.getElementById('adminSearchInput').value.toLowerCase().trim();
            const filtered = allProductsCache.filter(p => p.title.toLowerCase().includes(query));
            renderAdminProducts(filtered);
        }

        function toggleStock(id, currentStatus) {
            db.collection('products').doc(id).update({
                inStock: !currentStatus
            });
        }

        function deleteProduct(id) {
            if(confirm('ডিলিট করতে চান?')) db.collection('products').doc(id).delete();
        }

        /* ---------- ORDERS ---------- */
        function loadOrders() {
            db.collection('orders').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                allOrdersCache = [];
                snapshot.forEach(doc => {
                    allOrdersCache.push({ id: doc.id, ...doc.data() });
                });

                if (!isFirstOrdersSnapshot) {
                    snapshot.docChanges().forEach(change => {
                        if (change.type === 'added') {
                            notifyNewOrder(change.doc.data());
                        }
                    });
                }
                isFirstOrdersSnapshot = false;

                document.getElementById('orderCountBadge').innerText = allOrdersCache.length > 0 ? allOrdersCache.length : '';
                renderOrders(allOrdersCache);
            });
        }

        function statusOptionsHTML(currentStatus) {
            return ORDER_STATUS_OPTIONS.map(o =>
                `<option value="${o.value}" ${currentStatus === o.value ? 'selected' : ''}>${o.label}</option>`
            ).join('');
        }

        function renderOrders(orders) {
            const list = document.getElementById('ordersList');
            list.innerHTML = '';

            if (orders.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:var(--text-dim); padding:15px; font-size:13px;">এখনো কোনো অর্ডার আসেনি।</p>';
                return;
            }

            orders.forEach(o => {
                const div = document.createElement('div');
                div.className = 'order-item';
                const time = o.createdAt && o.createdAt.toDate ? o.createdAt.toDate().toLocaleString('bn-BD') : '';
                div.innerHTML = `
                    <span class="order-status-badge">${o.status || 'Pending'}</span>
                    <div class="order-top">
                        <span class="order-product"><i class="fa-solid fa-box"></i> ${o.product || '-'}</span>
                        <span class="order-total">৳${o.total || 0}</span>
                    </div>
                    <div class="order-details">
                        <div><b>কাস্টমার:</b> ${o.customerName || '-'}</div>
                        <div><b>মোবাইল:</b> ${o.customerPhone || '-'}</div>
                        <div><b>ঠিকানা:</b> ${o.customerAddress || '-'}</div>
                        <div><b>ডেলিভারি এরিয়া:</b> ${o.deliveryArea || '-'}</div>
                        <div><b>পেমেন্ট:</b> ${o.paymentMethod || '-'} ${o.trxId ? '(TrxID: ' + o.trxId + ')' : ''}</div>
                        ${time ? `<div><b>সময়:</b> ${time}</div>` : ''}
                    </div>
                    <div class="order-edit">
                        <label>স্ট্যাটাস</label>
                        <select id="status_${o.id}" style="margin-bottom:8px;">${statusOptionsHTML(o.status)}</select>
                        <div class="grid2">
                            <div>
                                <label>রাইডারের নাম</label>
                                <input id="rider_${o.id}" type="text" value="${o.riderName || ''}" placeholder="যেমন: করিম">
                            </div>
                            <div>
                                <label>রাইডারের ফোন</label>
                                <input id="riderPhone_${o.id}" type="text" value="${o.riderPhone || ''}" placeholder="01XXXXXXXXX">
                            </div>
                        </div>
                        <div class="grid2">
                            <div>
                                <label>ডেলিভারি পার্টনার</label>
                                <input id="service_${o.id}" type="text" list="deliveryServices" value="${o.deliveryService || ''}" placeholder="Pathao/Steadfast...">
                            </div>
                            <div>
                                <label>প্রত্যাশিত সময়</label>
                                <input id="eta_${o.id}" type="text" value="${o.estimatedTime || ''}" placeholder="আজ সন্ধ্যা ৬টা">
                            </div>
                        </div>
                    </div>
                    <div class="order-actions">
                        <a class="btn-call" href="tel:${o.customerPhone || ''}"><i class="fa-solid fa-phone"></i> কল</a>
                        <button class="btn-update" onclick="updateOrder('${o.id}')"><i class="fa-solid fa-floppy-disk"></i> আপডেট</button>
                        <button class="btn-order-delete" onclick="deleteOrder('${o.id}')"><i class="fa-solid fa-trash"></i> ডিলিট</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function filterOrders() {
            const query = document.getElementById('orderSearchInput').value.toLowerCase().trim();
            const filtered = allOrdersCache.filter(o =>
                (o.customerName || '').toLowerCase().includes(query) ||
                (o.customerPhone || '').toLowerCase().includes(query) ||
                (o.product || '').toLowerCase().includes(query)
            );
            renderOrders(filtered);
        }

        function updateOrder(id) {
            const status = document.getElementById('status_' + id).value;
            const riderName = document.getElementById('rider_' + id).value.trim();
            const riderPhone = document.getElementById('riderPhone_' + id).value.trim();
            const deliveryService = document.getElementById('service_' + id).value.trim();
            const estimatedTime = document.getElementById('eta_' + id).value.trim();

            db.collection('orders').doc(id).update({
                status, riderName, riderPhone, deliveryService, estimatedTime,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert('অর্ডার স্ট্যাটাস আপডেট হয়েছে! কাস্টমার এখন লাইভ দেখতে পাবেন।');
            }).catch(err => {
                console.error(err);
                alert('আপডেট করতে সমস্যা হয়েছে।');
            });
        }

        function deleteOrder(id) {
            if (confirm('অর্ডারটি ডিলিট করতে চান? (ডেলিভারি সম্পন্ন হয়ে থাকলে এটি করুন)')) {
                db.collection('orders').doc(id).delete();
            }
        }
    </script>
</body>
</html>
