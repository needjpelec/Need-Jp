<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NeedJP - Premium Gadgets & Lifestyle Accessories</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary-gold: #c59d5f;
            --primary-dark: #111111;
            --accent-red: #e60023;
            --bg-light: #f8f9fa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-light); color: #333; padding-top: 70px; padding-bottom: 30px; }
        
        /* Header */
        header {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: var(--primary-dark); color: #fff;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; z-index: 1000; border-bottom: 2px solid var(--primary-gold);
        }
        header .logo { font-size: 18px; font-weight: bold; color: var(--primary-gold); display: flex; align-items: center; gap: 8px; }
        
        .container { max-width: 800px; margin: 0 auto; padding: 10px; }
        
        /* Search Box */
        .search-container { margin-bottom: 15px; position: relative; }
        .search-container input {
            width: 100%; padding: 12px 15px 12px 40px; border-radius: 25px;
            border: 1.5px solid #ddd; outline: none; font-size: 14px;
        }
        .search-container i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888; }
        
        /* Product Grid */
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 600px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }

        /* Product Card */
        .product-card {
            background: #fff; border-radius: 12px; overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column;
            position: relative; transition: transform 0.2s;
        }
        .product-card img { width: 100%; height: 160px; object-fit: cover; }
        .product-details { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; line-height: 1.3; color: #222; }
        .product-price { font-size: 15px; font-weight: bold; color: var(--primary-gold); margin-bottom: 10px; }
        
        /* Badges & Buttons */
        .stock-badge {
            position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7);
            color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 10px; font-weight: bold;
        }
        .out-of-stock { background: var(--accent-red) !important; }
        
        .btn-order {
            margin-top: auto; background: #25D366; color: white; border: none;
            padding: 8px; border-radius: 8px; font-weight: bold; font-size: 12px;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            text-decoration: none; cursor: pointer; text-align: center;
        }
        .btn-disabled { background: #ccc !important; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-bag-shopping"></i> NeedJP</div>
    </header>

    <div class="container">
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="প্রোডাক্ট খুঁজুন..." oninput="filterProducts()">
        </div>

        <div class="product-grid" id="productContainer">
            <p style="text-align: center; grid-column: span 2;">প্রোডাক্ট লোড হচ্ছে...</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAyvwU9znCjByCZ_UZveWo8m-9EDvDiHJk",
          authDomain: "needjp-store.firebaseapp.com",
          projectId: "needjp-store",
          storageBucket: "needjp-store.firebasestorage.app",
          messagingSenderId: "1876371529444",
          appId: "1:1876371529444:web:9ab84f1af05e79b04756f1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allProducts = [];
        const WHATSAPP_NUMBER = "8801700000000"; // এখানে আপনার হোয়াটসঅ্যাপ নাম্বার দিন (যেমন: 88017XXXXXXXX)

        document.addEventListener('DOMContentLoaded', loadProducts);

        function loadProducts() {
            db.collection('products').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                allProducts = [];
                snapshot.forEach(doc => {
                    allProducts.push({ id: doc.id, ...doc.data() });
                });
                renderProducts(allProducts);
            });
        }

        function renderProducts(products) {
            const container = document.getElementById('productContainer');
            container.innerHTML = '';

            if (products.length === 0) {
                container.innerHTML = '<p style="text-align:center; grid-column: span 2; color:#888;">কোনো প্রোডাক্ট পাওয়া যায়নি!</p>';
                return;
            }

            products.forEach(p => {
                const isStock = p.inStock !== false;
                const waMessage = encodeURIComponent(`হ্যালো NeedJP, আমি এই প্রোডাক্টটি অর্ডার করতে চাই:\n\n*প্রোডাক্ট:* ${p.title}\n*মূল্য:* ৳${p.price}`);
                const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${waMessage}`;

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <span class="stock-badge ${isStock ? '' : 'out-of-stock'}">${isStock ? 'In Stock' : 'Stock Out'}</span>
                    <img src="${p.image}" alt="${p.title}">
                    <div class="product-details">
                        <div class="product-title">${p.title}</div>
                        <div class="product-price">৳${p.price}</div>
                        ${isStock ? 
                            `<a href="${waUrl}" target="_blank" class="btn-order"><i class="fa-brands fa-whatsapp"></i> অর্ডার করুন</a>` : 
                            `<button class="btn-order btn-disabled" disabled>স্টক আউট</button>`
                        }
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = allProducts.filter(p => p.title.toLowerCase().includes(query));
            renderProducts(filtered);
        }
    </script>
</body>
</html>
